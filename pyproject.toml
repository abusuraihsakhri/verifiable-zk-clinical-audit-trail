[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-zk-clinical-audit-trail"
version = "2.0.0"
description = "ZK-AuditTrail: Merkle Tree Zero-Knowledge EHR Access & Modification Prover"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
verifiable-zk-clinical-audit-trail = "zk_audit_trail.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/verifiable-zk-clinical-audit-trail"
Repository = "https://github.com/abusuraihsakhri/verifiable-zk-clinical-audit-trail.git"
