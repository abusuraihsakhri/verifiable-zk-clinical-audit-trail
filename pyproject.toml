[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-zk-clinical-audit-trail"
version = "2.0.0"
description = "ZK-AuditTrail: Merkle Tree Zero-Knowledge EHR Access & Modification Prover"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.20,<1"]
test = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
verifiable-zk-clinical-audit-trail = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/verifiable-zk-clinical-audit-trail"
Repository = "https://github.com/abusuraihsakhri/verifiable-zk-clinical-audit-trail.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "zk_audit_trail*"]
namespaces = false
