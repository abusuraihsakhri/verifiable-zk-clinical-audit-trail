version: '3.8'

services:
  verifiable-zk-clinical-audit-trail:
    build: .
    container_name: verifiable-zk-clinical-audit-trail
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=verifiable-zk-clinical-audit-trail-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
